  <line x1="84" y1="68" x2="84" y2="90" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="76" x2="102" y2="76" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
  <!-- 11.11 マーク -->
