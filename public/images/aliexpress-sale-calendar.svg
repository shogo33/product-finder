  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>

  <!-- カレンダーアイコン -->
  <rect x="30" y="32" width="72" height="68" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="30" y="32" width="72" height="20" rx="8" fill="#f59e0b"/>
  <rect x="30" y="44" width="72" height="8" fill="#f59e0b"/>
