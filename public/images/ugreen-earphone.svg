<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- Background -->
  <rect width="400" height="220" fill="#fff1f2"/>
  <!-- Card -->
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#e8253a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="50" y="20" width="300" height="180" rx="14" fill="#ffffff" filter="url(#sh)"/>
  <!-- Header bar -->
  <rect x="50" y="20" width="300" height="38" rx="14" fill="#e8253a"/>
  <rect x="50" y="44" width="300" height="14" fill="#e8253a"/>
  <text x="200" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">UGREENイヤホン比較</text>

  <!-- Left earbud body -->
  <ellipse cx="138" cy="105" rx="30" ry="38" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="138" cy="105" rx="18" ry="22" fill="#e8253a" opacity="0.9"/>
  <!-- ANC badge on left bud -->
  <text x="138" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff">ANC</text>
  <text x="138" y="112" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#fff" opacity="0.85">ノイキャン</text>

  <!-- Right earbud body -->
  <ellipse cx="218" cy="105" rx="30" ry="38" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="218" cy="105" rx="18" ry="22" fill="#2a2a2a" opacity="0.9"/>
  <text x="218" y="109" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#fff" opacity="0.75">HiTune</text>

  <!-- Sound wave lines (right side) -->
  <path d="M258 90 Q268 105 258 120" stroke="#e8253a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M266 83 Q280 105 266 127" stroke="#e8253a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Feature badges -->
  <rect x="262" y="72" width="58" height="20" rx="10" fill="#e8253a"/>
  <text x="291" y="86" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff">IPX5防水</text>
  <rect x="262" y="98" width="58" height="20" rx="10" fill="#1a1a2e"/>
  <text x="291" y="112" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff">BT 5.3</text>
  <rect x="262" y="124" width="58" height="20" rx="10" fill="#0f4c81"/>
  <text x="291" y="138" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff">36時間</text>

  <!-- 5選 badge -->
  <rect x="292" y="24" width="46" height="18" rx="9" fill="#fff" opacity="0.9"/>
  <text x="315" y="36" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#e8253a">5選</text>

  <!-- Tagline -->
  <text x="200" y="192" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">AliExpressで最安値 · 2026年最新比較</text>
</svg>
