<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#f5f3ff"/>
  <!-- ルーラー（定規） -->
  <rect x="44" y="88" width="312" height="44" rx="6" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <!-- 目盛り -->
  <line x1="80"  y1="88" x2="80"  y2="100" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="116" y1="88" x2="116" y2="100" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="152" y1="88" x2="152" y2="100" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="188" y1="88" x2="188" y2="100" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="224" y1="88" x2="224" y2="100" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="260" y1="88" x2="260" y2="100" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="296" y1="88" x2="296" y2="100" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- サイズラベル -->
  <text x="80"  y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">S</text>
  <text x="116" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">M</text>
  <text x="152" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">L</text>
  <text x="188" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">XL</text>
  <text x="224" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">XXL</text>
  <text x="260" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">XXXL</text>
  <!-- サイズ換算カード -->
  <rect x="68" y="134" width="264" height="46" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="84" y="151" font-family="sans-serif" font-size="9" fill="#6b7280">中国 M</text>
  <text x="84" y="167" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed">日本 S〜M</text>
  <line x1="158" y1="136" x2="158" y2="178" stroke="#e5e7eb" stroke-width="1"/>
  <text x="174" y="151" font-family="sans-serif" font-size="9" fill="#6b7280">中国 XL</text>
  <text x="174" y="167" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed">日本 M〜L</text>
  <line x1="248" y1="136" x2="248" y2="178" stroke="#e5e7eb" stroke-width="1"/>
  <text x="264" y="151" font-family="sans-serif" font-size="9" fill="#6b7280">中国 XXL</text>
  <text x="264" y="167" font-family="sans-serif" font-size="11" font-weight="700" fill="#e8253a">+1〜2上げ</text>
  <!-- 上部ラベル -->
  <rect x="148" y="48" width="104" height="28" rx="14" fill="#7c3aed"/>
  <text x="200" y="66" font-family="sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">サイズ換算表</text>
  <text x="200" y="210" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">中国サイズ→日本サイズ対応ガイド</text>
</svg>
