  <text x="114" y="153" font-family="sans-serif" font-size="11" font-weight="900" fill="#f97316" text-anchor="middle">無料</text>
  <!-- 矢印 -->
  <path d="M196 128 L222 128" stroke="#f97316" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="222,122 232,128 222,134" fill="#f97316"/>
  <!-- 料金カード -->
  <rect x="236" y="68" width="120" height="108" rx="10" fill="white" stroke="#f97316" stroke-width="1.5"/>
  <rect x="236" y="68" width="120" height="28" rx="10" fill="#f97316"/>
  <rect x="236" y="82" width="120" height="14" fill="#f97316"/>
  <text x="296" y="93" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">配送料金比較</text>
  <text x="248" y="116" font-family="sans-serif" font-size="9" fill="#374151">Standard</text>
  <text x="346" y="116" font-family="sans-serif" font-size="9" font-weight="700" fill="#16a34a" text-anchor="end">無料〜</text>
  <line x1="244" y1="122" x2="348" y2="122" stroke="#e5e7eb" stroke-width="1"/>
