  <line x1="244" y1="142" x2="348" y2="142" stroke="#e5e7eb" stroke-width="1"/>
  <text x="248" y="156" font-family="sans-serif" font-size="9" fill="#374151">DHL</text>
  <text x="346" y="156" font-family="sans-serif" font-size="9" fill="#374151" text-anchor="end">2,000円〜</text>
  <text x="200" y="210" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">送料無料の条件・配送方法比較</text>
