<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#fff7ed"/>
  <!-- 配送トラック -->
  <rect x="44" y="88" width="140" height="80" rx="8" fill="white" stroke="#f97316" stroke-width="2"/>
  <rect x="44" y="88" width="140" height="26" rx="8" fill="#f97316"/>
  <rect x="44" y="100" width="140" height="14" fill="#f97316"/>
  <text x="114" y="111" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">Standard Shipping</text>
  <!-- 無料バッジ -->
  <circle cx="114" cy="143" r="22" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
