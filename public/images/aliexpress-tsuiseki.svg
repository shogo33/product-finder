<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d42840"/>
      <stop offset="100%" stop-color="#901c28"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#g)" rx="14"/>
  <!-- Decorative circles -->
  <circle cx="660" cy="-40" r="200" fill="white" fill-opacity="0.06"/>
  <circle cx="750" cy="260" r="160" fill="white" fill-opacity="0.05"/>
  <circle cx="400" cy="110" r="280" fill="white" fill-opacity="0.02"/>
  <!-- Dot grid -->
  <g fill="white" fill-opacity="0.08">
    <circle cx="580" cy="40" r="2.5"/><circle cx="620" cy="40" r="2.5"/><circle cx="660" cy="40" r="2.5"/><circle cx="700" cy="40" r="2.5"/>
    <circle cx="580" cy="80" r="2.5"/><circle cx="620" cy="80" r="2.5"/><circle cx="660" cy="80" r="2.5"/><circle cx="700" cy="80" r="2.5"/>
    <circle cx="580" cy="120" r="2.5"/><circle cx="620" cy="120" r="2.5"/><circle cx="660" cy="120" r="2.5"/><circle cx="700" cy="120" r="2.5"/>
    <circle cx="580" cy="160" r="2.5"/><circle cx="620" cy="160" r="2.5"/><circle cx="660" cy="160" r="2.5"/><circle cx="700" cy="160" r="2.5"/>
  </g>
  <!-- Emoji ring -->
  <circle cx="118" cy="110" r="72" fill="white" fill-opacity="0.12"/>
  <text x="118" y="142" font-size="76" text-anchor="middle">📍</text>
  <!-- Divider -->
  <line x1="215" y1="55" x2="215" y2="168" stroke="white" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- Label pill -->
  <rect x="232" y="52" width="12" height="26" rx="13" fill="white" fill-opacity="0.18"/>
  <text x="238" y="70" font-family="sans-serif" font-size="13" font-weight="700" fill="white" fill-opacity="0.95" text-anchor="middle">荷物追跡</text>
  <!-- Sub text -->
  <text x="232" y="130" font-family="sans-serif" font-size="15" fill="white" fill-opacity="0.75">追跡番号の見方・できない時の対処</text>
  <!-- Product Finder brand -->
  <text x="232" y="178" font-family="sans-serif" font-size="11" fill="white" fill-opacity="0.45">Product Finder | アリエクの格安商品・お得情報研究所</text>
</svg>
