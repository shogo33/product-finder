<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- Background -->
  <rect width="400" height="220" fill="#fff1f2"/>
  <!-- Card -->
  <rect x="50" y="20" width="300" height="180" rx="14" fill="#ffffff" filter="url(#sh)"/>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#e8253a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Header bar -->
  <rect x="50" y="20" width="300" height="38" rx="14" fill="#e8253a"/>
  <rect x="50" y="44" width="300" height="14" fill="#e8253a"/>
  <text x="200" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">Baseusモバイルバッテリー比較</text>
  <!-- Battery body -->
  <rect x="100" y="72" width="110" height="58" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <rect x="205" y="88" width="10" height="26" rx="3" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <!-- Battery level fill -->
  <rect x="104" y="76" width="85" height="50" rx="5" fill="#e8253a" opacity="0.85"/>
  <!-- % text -->
  <text x="155" y="106" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">85%</text>
  <!-- Lightning bolt -->
  <text x="155" y="122" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#fff" opacity="0.85">急速充電中</text>
  <!-- Watt badges -->
  <rect x="230" y="72" width="48" height="22" rx="11" fill="#e8253a"/>
  <text x="254" y="87" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">20W</text>
  <rect x="230" y="100" width="48" height="22" rx="11" fill="#2a2a2a"/>
  <text x="254" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">45W</text>
  <rect x="230" y="128" width="48" height="22" rx="11" fill="#0f4c81"/>
  <text x="254" y="143" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">100W</text>
  <!-- Badge -->
  <rect x="292" y="24" width="46" height="18" rx="9" fill="#fff" opacity="0.9"/>
  <text x="315" y="36" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#e8253a">10選</text>
  <!-- Tagline -->
  <text x="200" y="192" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">AliExpressで最安値 · 2026年最新比較</text>
</svg>
