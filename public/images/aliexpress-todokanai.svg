<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#fff7ed"/>
  <!-- 背景サークル -->
  <circle cx="210" cy="105" r="80" fill="#ffedd5" opacity="0.8"/>
  <!-- 荷物ボックス -->
  <rect x="130" y="72" width="100" height="84" rx="8" fill="white" stroke="#fb923c" stroke-width="2.5"/>
  <line x1="130" y1="100" x2="230" y2="100" stroke="#fb923c" stroke-width="2"/>
  <line x1="180" y1="72" x2="180" y2="156" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- テープ -->
  <rect x="152" y="95" width="56" height="10" rx="3" fill="#fed7aa"/>
  <!-- ？マーク -->
  <circle cx="310" cy="88" r="28" fill="#f97316"/>
  <text x="310" y="98" font-family="sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">?</text>
  <!-- 矢印（行方不明感） -->
  <path d="M234 114 Q270 114 282 98" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="5,3" stroke-linecap="round"/>
  <polygon points="278,92 288,100 280,106" fill="#f97316"/>
  <!-- タイトルバッジ -->
  <rect x="26" y="62" width="96" height="22" rx="11" fill="#f97316"/>
  <text x="74" y="77" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">届かない時</text>
  <text x="74" y="102" font-family="sans-serif" font-size="20" font-weight="900" fill="#1c1917" text-anchor="middle">返金</text>
  <text x="74" y="120" font-family="sans-serif" font-size="10" fill="#78716c" text-anchor="middle">申請の手順</text>
  <text x="74" y="140" font-family="sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">Dispute完全ガイド</text>
  <text x="200" y="210" font-family="sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">届かない・紛失時の返金対処法</text>
</svg>
