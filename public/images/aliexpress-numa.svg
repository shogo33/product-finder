<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <radialGradient id="vortex" cx="52%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="220" fill="#0f172a"/>

  <!-- 渦巻き（沼のイメージ） -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="200" cy="125" r="70" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="200" cy="125" r="50" fill="none" stroke="#ff6b35" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="200" cy="125" r="32" fill="none" stroke="#ff6b35" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="200" cy="125" r="16" fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-opacity="0.7"/>
  <circle cx="200" cy="125" r="6" fill="#ff6b35" fill-opacity="0.9"/>

  <!-- 渦グラデーション -->
  <ellipse cx="200" cy="125" rx="95" ry="55" fill="url(#vortex)"/>

  <!-- 落下するパッケージ（沼に吸い込まれるイメージ） -->
  <!-- 左上パッケージ -->
  <g transform="translate(52,28) rotate(-15)">
    <rect width="22" height="18" rx="2" fill="#1e293b" stroke="#ff6b35" stroke-width="1.2"/>
    <line x1="11" y1="0" x2="11" y2="18" stroke="#ff6b35" stroke-width="0.8" stroke-opacity="0.6"/>
    <line x1="0" y1="9" x2="22" y2="9" stroke="#ff6b35" stroke-width="0.8" stroke-opacity="0.6"/>
  </g>
  <!-- 右上パッケージ -->
  <g transform="translate(318,18) rotate(12)">
    <rect width="18" height="15" rx="2" fill="#1e293b" stroke="#7c3aed" stroke-width="1.2"/>
    <line x1="9" y1="0" x2="9" y2="15" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.6"/>
    <line x1="0" y1="7" x2="18" y2="7" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.6"/>
  </g>
  <!-- 左中パッケージ -->
  <g transform="translate(30,90) rotate(-8)">
    <rect width="16" height="13" rx="2" fill="#1e293b" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.7"/>
    <line x1="8" y1="0" x2="8" y2="13" stroke="#ff6b35" stroke-width="0.7" stroke-opacity="0.5"/>
  </g>
  <!-- 右中パッケージ -->
  <g transform="translate(345,75) rotate(20)">
    <rect width="20" height="16" rx="2" fill="#1e293b" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.7"/>
    <line x1="10" y1="0" x2="10" y2="16" stroke="#ff6b35" stroke-width="0.7" stroke-opacity="0.5"/>
    <line x1="0" y1="8" x2="20" y2="8" stroke="#ff6b35" stroke-width="0.7" stroke-opacity="0.5"/>
  </g>

  <!-- ★アクセント -->
  <text x="88" y="62" font-size="11" fill="#ff6b35" fill-opacity="0.7">★</text>
  <text x="305" y="52" font-size="9" fill="#7c3aed" fill-opacity="0.8">★</text>
  <text x="340" y="110" font-size="8" fill="#ff6b35" fill-opacity="0.5">★</text>
  <text x="45" y="135" font-size="7" fill="#7c3aed" fill-opacity="0.5">★</text>

  <!-- メインテキスト -->
  <text x="200" y="62" font-family="'Hiragino Kaku Gothic Pro','Meiryo','sans-serif'" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">アリエク沼</text>

  <!-- サブテキスト -->
  <text x="200" y="90" font-family="'Hiragino Kaku Gothic Pro','Meiryo','sans-serif'" font-size="14" fill="#ff6b35" text-anchor="middle" letter-spacing="2">気づいたら、沼ってた。</text>

  <!-- 区切り線 -->
  <line x1="130" y1="100" x2="270" y2="100" stroke="#ff6b35" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- ジャンルタグ -->
  <rect x="68" y="108" width="58" height="16" rx="8" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="97" y="120" font-family="'Hiragino Kaku Gothic Pro','Meiryo','sans-serif'" font-size="9" fill="#c4b5fd" text-anchor="middle">キーボード沼</text>

  <rect x="134" y="108" width="50" height="16" rx="8" fill="#ff6b35" fill-opacity="0.2" stroke="#ff6b35" stroke-width="0.8"/>
  <text x="159" y="120" font-family="'Hiragino Kaku Gothic Pro','Meiryo','sans-serif'" font-size="9" fill="#fdba74" text-anchor="middle">イヤホン沼</text>

  <rect x="192" y="108" width="50" height="16" rx="8" fill="#7c3aed" fill-opacity="0.3" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="217" y="120" font-family="'Hiragino Kaku Gothic Pro','Meiryo','sans-serif'" font-size="9" fill="#c4b5fd" text-anchor="middle">ガジェット沼</text>

  <rect x="250" y="108" width="50" height="16" rx="8" fill="#ff6b35" fill-opacity="0.2" stroke="#ff6b35" stroke-width="0.8"/>
  <text x="275" y="120" font-family="'Hiragino Kaku Gothic Pro','Meiryo','sans-serif'" font-size="9" fill="#fdba74" text-anchor="middle">ゲーム機沼</text>

  <!-- 下部タイトル -->
  <text x="200" y="210" font-family="'Hiragino Kaku Gothic Pro','Meiryo','sans-serif'" font-size="10" fill="#9ca3af" text-anchor="middle">気づいたら沼。アリエクにハマる理由とジャンル別ガイド</text>
</svg>
